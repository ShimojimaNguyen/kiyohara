name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Thứ tự có chủ đích: test trước (nhanh, không mạng), rồi typecheck,
      # rồi build. Cái rẻ nhất báo lỗi trước.
      - name: Test logic tài chính
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
